plugins {
    id 'com.android.application'
}

android {
    namespace 'com.soverixnet.soveravpn'
    compileSdk 36

    defaultConfig {
        applicationId 'com.soverixnet.soveravpn'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '0.1.0-preview'

        // Set through gradle.properties or -PSOVERA_API_BASE_URL=https://... before release.
        def apiBase = providers.gradleProperty('SOVERA_API_BASE_URL').orElse('').get()
        buildConfigField 'String', 'SOVERA_API_BASE_URL', '"' + apiBase.replace('"','\\"') + '"'
    }

    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
